<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0b1b33" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xpress Waste Removals | Clear space. Keep life moving.</title>
    <meta name="description" content="Xpress Waste Removals: reliable, responsible rubbish removal across Coventry, Leicester and Birmingham. Get a free quote today." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/hero-crew.webp" as="image" type="image/webp" fetchpriority="high" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /* Hero 3D depth: feeds mouse position to CSS (--px, --py). Skips touch and reduced motion. */
      (function () {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var hero = null, tx = 0, ty = 0, cx = 0, cy = 0, raf = 0;
        function loop() {
          cx += (tx - cx) * 0.08; cy += (ty - cy) * 0.08;
          if (hero && hero.isConnected) {
            hero.style.setProperty('--px', cx.toFixed(3));
            hero.style.setProperty('--py', cy.toFixed(3));
          }
          raf = (Math.abs(tx - cx) > 0.002 || Math.abs(ty - cy) > 0.002) ? requestAnimationFrame(loop) : 0;
        }
        document.addEventListener('pointermove', function (e) {
          if (e.pointerType === 'touch') return;
          if (!hero || !hero.isConnected) hero = document.querySelector('.hero.hero-x:not(.hero-inner)');
          if (!hero) return;
          var r = hero.getBoundingClientRect();
          if (e.clientY < r.top || e.clientY > r.bottom) { tx = 0; ty = 0; }
          else {
            tx = ((e.clientX - r.left) / r.width - 0.5) * 2;
            ty = ((e.clientY - r.top) / r.height - 0.5) * 2;
          }
          if (!raf) raf = requestAnimationFrame(loop);
        }, { passive: true });
      })();
    </script>
  </body>
</html>
